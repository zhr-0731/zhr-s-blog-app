name: Build Android APK

on:
  workflow_dispatch:   # 仅允许手动触发

# 全局授予写入权限，以便后续提交和 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.set-path.outputs.apk_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Gradle Wrapper if missing
        id: wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar not found, generating..."
            gradle wrapper --gradle-version=8.2
            chmod +x gradlew
            echo "generated=true" >> $GITHUB_OUTPUT
          else
            echo "✅ gradle-wrapper.jar already exists."
            echo "generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push Gradle Wrapper if generated
        if: steps.wrapper.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat
          if ! git diff --cached --quiet; then
            git commit -m "Add gradle-wrapper.jar [skip ci]"
            git push
          fi

      - name: Download icon
        run: |
          curl -L -o icon.png https://s41.ax1x.com/2025/12/07/pZnSiid.png
          if [ ! -s icon.png ]; then
            convert -size 192x192 xc:blue -fill white -gravity center -pointsize 72 -annotate 0 "B" icon.png
          fi

      - name: Convert icon to mipmap
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p app/src/main/res/mipmap-$d
          done
          declare -A sizes=([mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192)
          for d in "${!sizes[@]}"; do
            s=${sizes[$d]}
            convert icon.png -resize ${s}x${s} -background transparent -gravity center -extent ${s}x${s} app/src/main/res/mipmap-$d/ic_launcher.png
            cp app/src/main/res/mipmap-$d/ic_launcher.png app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Set APK path output
        id: set-path
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload APK as artifact (for later jobs)
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1   # 仅需短期保留，因为后续 job 立即使用

  upload-to-repo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: ./apk

      - name: Commit and push APK to repository root
        run: |
          # 确保 apk 目录存在
          mkdir -p apk
          # 将下载的 APK 移动到 apk 目录（如果下载时已经是文件，可能需要移动）
          # 注意：下载的 artifact 可能是一个或多个 apk 文件，我们将其全部移动到 apk/ 下
          mv ./debug-apk/*.apk ./apk/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/*.apk
          if ! git diff --cached --quiet; then
            git commit -m "Update APK [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

  upload-to-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: ./apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: "自动构建的 Debug APK，基于最新提交。"
          draft: false
          prerelease: true
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}