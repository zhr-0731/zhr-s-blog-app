name: Build Android APK

on:
  workflow_dispatch:   # 仅允许手动触发

# 全局授予写入权限，以便后续提交和 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apk_path: ${{ steps.set-path.outputs.apk_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Gradle Wrapper if missing
        id: wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar not found, generating..."
            gradle wrapper --gradle-version=8.2
            chmod +x gradlew
            echo "generated=true" >> $GITHUB_OUTPUT
          else
            echo "✅ gradle-wrapper.jar already exists."
            echo "generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push Gradle Wrapper if generated
        if: steps.wrapper.outputs.generated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/wrapper/gradle-wrapper.jar gradlew gradlew.bat
          if ! git diff --cached --quiet; then
            git commit -m "Add gradle-wrapper.jar [skip ci]"
            git push
          fi

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 构建 APK 并将输出同时保存到 build.log
      - name: Build APK
        run: |
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log
        shell: bash

      - name: Extract version info and generate version.json
        id: version
        run: |
          # 从 build.gradle.kts 提取版本信息
          versionName=$(grep 'versionName =' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "(.*)"/\1/')
          versionCode=$(grep 'versionCode =' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode = (.*)/\1/')
          buildType="debug"
          buildTime=$(date -Iseconds)
          commitSha=${{ github.sha }}
          runNumber=${{ github.run_number }}
          apkFile=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          apkHash=$(sha256sum "$apkFile" | awk '{print $1}')
          jq -n \
            --arg vn "$versionName" \
            --arg vc "$versionCode" \
            --arg bt "$buildType" \
            --arg btTime "$buildTime" \
            --arg sha "$commitSha" \
            --arg run "$runNumber" \
            --arg hash "$apkHash" \
            '{versionName: $vn, versionCode: $vc, buildType: $bt, buildTime: $btTime, commitSha: $sha, runNumber: $run, apkHash: $hash}' > version.json

      - name: Prepare build info artifact
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          mkdir -p build-info/$TIMESTAMP
          mv version.json build.log build-info/$TIMESTAMP/
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV

      - name: Upload APK as artifact (for later jobs)
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1

      - name: Upload build info artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info/
          retention-days: 1

      - name: Set APK path output
        id: set-path
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

  upload-to-repo:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: ./apk

      - name: Commit and push APK to repository root
        run: |
          mkdir -p apk
          mv ./debug-apk/*.apk ./apk/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk/*.apk
          if ! git diff --cached --quiet; then
            git commit -m "Update APK [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

  upload-to-release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: ./apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: "自动构建的 Debug APK，基于最新提交。"
          draft: false
          prerelease: true
          files: ./apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  record-build-info:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build info artifact
        uses: actions/download-artifact@v4
        with:
          name: build-info
          path: ./build-info

      - name: Copy files to json/ and log/ directories and commit
        run: |
          # 获取时间戳目录名（即 build-info 下的唯一子目录）
          TIMESTAMP_DIR=$(ls build-info/ | head -1)
          mkdir -p json log
          cp build-info/$TIMESTAMP_DIR/version.json json/build_$TIMESTAMP_DIR.json
          cp build-info/$TIMESTAMP_DIR/build.log log/build_$TIMESTAMP_DIR.log

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/ log/
          if ! git diff --cached --quiet; then
            git commit -m "Add build info for run ${{ github.run_number }} [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi