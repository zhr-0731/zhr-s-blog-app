name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 JDK 17（Android Gradle 插件 8.2.0 需要）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 安装指定版本的 Gradle（用于生成 Wrapper）
      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # 4. 如果 gradle-wrapper.jar 缺失，则生成它
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar not found, generating..."
            gradle wrapper
            chmod +x gradlew
          else
            echo "✅ gradle-wrapper.jar already exists."
          fi

      # 5. 缓存 Gradle 依赖（加速构建）
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 6. 构建 Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 7. 上传 APK 作为 Artifact（保留 30 天）
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zhr-blog-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
